<div
  appHighlight="lightblue"
  class="course-card"
  [ngClass]="cardClasses"
  [ngStyle]="{'border-left':'8px solid '+getBorderColor()}">

  <h2>{{ course.name }}</h2>

  <p><strong>Course Code:</strong> {{ course.code }}</p>

  <p><strong>Credits:</strong> {{ course.credits | creditLabel }}</p>

  <p>
    <strong>Status:</strong>

    <span [ngSwitch]="course.gradeStatus">

      <span *ngSwitchCase="'passed'" style="color:green;font-weight:bold;">
        ✅ Passed
      </span>

      <span *ngSwitchCase="'failed'" style="color:red;font-weight:bold;">
        ❌ Failed
      </span>

      <span *ngSwitchDefault style="color:gray;font-weight:bold;">
        ⏳ Pending
      </span>

    </span>
  </p>

  <button (click)="toggleEnrollment()">
    {{ isEnrolled() ? 'Unenroll' : 'Enroll' }}
  </button>

  <button (click)="toggleDetails()">
    {{ isExpanded ? 'Hide Details' : 'Show Details' }}
  </button>

  <div *ngIf="isExpanded" class="details">

    <hr>

    <p><strong>Instructor:</strong> Dr. Smith</p>

    <p><strong>Duration:</strong> 12 Weeks</p>

    <p><strong>Semester:</strong> Fall 2026</p>

    <p><strong>Mode:</strong> Online</p>

  </div>

</div>
