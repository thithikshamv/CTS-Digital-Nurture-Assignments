<h2>Student Profile</h2>

<h3>My Enrolled Courses</h3>

<div *ngIf="enrolledCourses.length > 0; else noCourses">

  <div
    *ngFor="let course of enrolledCourses"
    style="border:1px solid #ccc; padding:10px; margin-bottom:10px; border-radius:6px;">

    <h4>{{ course.name }}</h4>

    <p><strong>Course Code:</strong> {{ course.code }}</p>

    <p><strong>Credits:</strong> {{ course.credits }}</p>

    <p><strong>Status:</strong> {{ course.gradeStatus }}</p>

  </div>

</div>

<ng-template #noCourses>

  <p>No enrolled courses yet.</p>

</ng-template>
